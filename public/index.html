<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ombor Shop — elektron savdo va ombor boshqaruvi</title>
  <meta name="description" content="Ombor Shop: katalog, savat, buyurtma va to'lov — hamda ombor qoldiqi, kirim va narx boshqaruvi." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2330'/%3E%3Cpath d='M16 6.5 25 11v10l-9 4.5L7 21V11z' fill='none' stroke='%234d8ff0' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 11l9 4.5 9-4.5M16 15.5V25' fill='none' stroke='%234d8ff0' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css?v=13" />
</head>
<body data-theme="shop">
  <div class="shell">
    <!-- ============ 1-CHIZIQ: TOPBAR ============ -->
    <header class="topbar">
      <div class="tb-brand">
        <span class="brand-mark">OS</span>
        <span class="brand-text">Ombor<em>Shop</em></span>
      </div>
      <button class="icon-btn burger" id="burger" aria-label="Menyu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="tb-user" id="tb-user" hidden>
        <span class="avatar" id="tb-avatar">?</span>
        <div class="tb-user-meta">
          <strong id="tb-name">—</strong>
          <span id="tb-sub">—</span>
        </div>
      </div>

      <div class="tb-right">
        <span class="tb-date" id="tb-date">—</span>
        <a href="#/cart" class="tb-ico cart-btn" id="cart-btn" title="Savat" aria-label="Savat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cart-count" hidden>0</span>
        </a>
        <button class="tb-ico" id="tb-bell" title="Bildirishnomalar" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="tb-badge" id="tb-badge" hidden>0</span>
        </button>
        <button class="tb-ico" id="tb-logout" title="Chiqish" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- ============ 2-CHIZIQ: SAHIFA PANELI ============ -->
    <div class="pagebar">
      <h1 class="pb-title" id="page-title">Katalog</h1>
      <div class="crumbs" id="crumbs"><span class="crumb active">Bosh sahifa</span></div>
      <form class="pb-search" id="search-form" role="search">
        <input id="search-input" type="search" placeholder="Mahsulot yoki kategoriya…" autocomplete="off" aria-label="Qidiruv" />
        <button type="submit" aria-label="Qidirish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </form>
    </div>

    <!-- ============ 3-QISM: YON PANEL + KONTENT ============ -->
    <div class="body-row">
      <aside class="sidebar" id="sidebar">
        <nav class="side-nav" id="side-nav"><!-- JS to'ldiradi --></nav>
        <div class="side-foot">
          <a href="#/login" class="side-login" id="side-login">Tizimga kirish</a>
          <a href="#/admin-login" class="side-login" id="side-admin-login" hidden>Admin kirish</a>
        </div>
      </aside>
      <div class="sidebar-scrim" id="scrim"></div>

      <main class="content" id="app" aria-live="polite">
        <div class="loading">Yuklanmoqda…</div>
      </main>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Sarlavha</h3>
        <button type="button" class="modal-close" id="modal-close" aria-label="Yopish">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="./app.js?v=13"></script>
</body>
</html>
